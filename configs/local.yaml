# configs/local.yaml — v8 (локальные пути)
seed: 42
device: cuda
precision: amp
channels_last: true
torch_compile: true

model:
  base_channels: 32
  width_multipliers: [2, 4, 8, 12]
  block_repeats: [1, 1, 1, 1]
  norm: groupnorm
  gn_groups: 16
  stochastic_depth: 0.1
  dropout: 0.2

data:
  root: "../datasets/InterfDataset"
  img_glob: "**/*.png,**/*.jpg,**/*.tif,**/*.bmp"
  image_size: 256

  label_parsing:
    filename_label_regex: "(\\d{1,2})"
    numbers_total: 11
    ignore_last_number: true
    bits_per_number: 5
    value_mode: "mod"

  normalization:
    type: "global_zscore"
    stats_path: "runs/stats/global_stats.npz"
    recompute: false

  augmentations:
    enabled: true
    hflip:
      enabled: true
      prob: 0.5
    vflip:
      enabled: true
      prob: 0.5
    rotate90:
      enabled: true
      prob: 0.5
    gaussian_noise:
      enabled: true
      std: 0.01
      prob: 0.2
    random_gamma:
      enabled: true
      range: [0.9, 1.1]
      prob: 0.3

  loader:
    workers: 16
    persistent_workers: true
    prefetch_factor: 4
    pin_memory: true
    drop_last: true
    shuffle: true

split:
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  stratified: true
  max_val_samples: 5000
  cache_dir: "runs/splits"
  reuse_cached: true

train:
  epochs: 50
  batch_size: 256
  grad_accum_steps: 1
  lr: 0.0007
  weight_decay: 0.05
  betas: [0.9, 0.999]
  ema_decay: 0.999
  max_grad_norm: 1.0
  early_stopping_patience: 10
  log_every_n_steps: 50
  tensorboard:
    enabled: true
    log_dir: "runs/tensorboard"
  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 1.0e-6
  bce_pos_weight: auto

eval:
  threshold: 0.5
  batch_size: 256
  metrics_output: "runs/metrics"

logging:
  out_dir: "runs"
  project_name: "interferogram_cnn"
  save_every: 1
  keep_last_k: 5
  dump_config: true
  env_report: true

checkpoint:
  path: null

testing:
  smoke_samples: 32
