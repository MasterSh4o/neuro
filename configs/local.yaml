# configs/local.yaml — v7c (под ваш путь)
seed: 42
device: cuda
precision: amp
channels_last: true
torch_compile: true

data:
  root: "../datasets/InterfDataset"
  img_glob: "**/*.png,**/*.jpg,**/*.tif,**/*.bmp"
  image_size: 256

  filename_label_regex: "(\\d{1,2})"
  numbers_total: 11
  ignore_last_number: true
  bits_per_number: 5
  value_mode: "mod"

  hflip: true
  vflip: true
  rotate90: true
  gaussian_noise_std: 0.01
  random_gamma: [0.9, 1.1]

  workers: 16
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  drop_last: true
  shuffle: true

train:
  epochs: 50
  batch_size: 256
  grad_accum_steps: 1
  lr: 0.0007
  weight_decay: 0.05
  betas: [0.9, 0.999]
  ema_decay: 0.999
  max_grad_norm: 1.0
  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 1.0e-6
  bce_pos_weight: auto

eval:
  threshold: 0.5

logging:
  out_dir: "runs"
  project_name: "interferogram_cnn"
  save_every: 1
  keep_last_k: 5

checkpoint:
  path: null
