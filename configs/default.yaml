# configs/default.yaml — v7c
seed: 42
device: cuda
precision: amp            # amp | fp32
channels_last: true
torch_compile: true

data:
  root: "/path/to/data/root"
  img_glob: "**/*.png,**/*.jpg,**/*.tif,**/*.bmp"
  image_size: 256

  # Метки из имени: 11 чисел, последнее игнорируется → используем 10 чисел
  filename_label_regex: "(\d{1,2})"
  numbers_total: 11
  ignore_last_number: true
  bits_per_number: 5
  value_mode: "mod"      # mod|clip|raise

  # Аугментации
  hflip: true
  vflip: true
  rotate90: true
  gaussian_noise_std: 0.01
  random_gamma: [0.9, 1.1]

  # Загрузка
  workers: 8
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  drop_last: true
  shuffle: true

train:
  epochs: 50
  batch_size: 256
  grad_accum_steps: 1
  lr: 0.0007
  weight_decay: 0.05
  betas: [0.9, 0.999]
  ema_decay: 0.999
  max_grad_norm: 1.0
  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 1.0e-6

  # Дисбаланс: auto pos_weight для BCE (neg/pos)
  bce_pos_weight: auto   # auto|none

eval:
  threshold: 0.5         # порог для multilabel

logging:
  out_dir: "runs"
  project_name: "interferogram_cnn"
  save_every: 1
  keep_last_k: 5

checkpoint:
  path: null
