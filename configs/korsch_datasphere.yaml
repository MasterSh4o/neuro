# configs/korsch_datasphere.yaml — Korsch High-Precision (Adapted for 119GB RAM)
# Optimized for available system with 119GB RAM
# Target: Sub-micron linear and sub-arcsecond angular precision

# Base configuration extends default.yaml
defaults:
  - default

# Environment settings
workspace_root: "/home/jupyter/work/resources/neuro"          # DataSphere workspace

data:
  root: "../../datasets/InterfDataset"
  image_size: 512                             # High resolution for precision

  loader:
    workers: 16                               # Optimized for 119GB RAM (reduced from 28)
    persistent_workers: true
    prefetch_factor: 6                          # Balanced prefetch for 119GB RAM
    pin_memory: true
    drop_last: true
    shuffle: true

# Model optimization for large GPU
model:
  base_channels: 128                          # Maximum channels for detail
  width_multipliers: [2, 4, 8, 16, 32]      # Extra scale
  block_repeats: [2, 3, 3, 3, 3]            # Very deep
  out_dim: 80                                # 2 mirrors × 5 params × 8 bits
  bits_per_parameter: 8                       # Maximum precision
  use_hybrid_head: true
  regression_dim: 10
  head_dropout: 0.2                           # Slightly reduced for large model
  hidden_dims: [4096, 2048, 1024, 512]     # Large MLP

# Training optimized for long runs
# DataSphere optimized batch sizes and workers
train:
  batch_size: 768                          # Optimized for 119GB RAM (reduced from 1024)
  grad_accum_steps: 2                         # Memory efficiency
  epochs: 180                                 # Slightly reduced for 119GB RAM
  lr: 0.00015                               # Slightly higher LR for smaller batch
  weight_decay: 0.008                          # Slightly higher for regularization
  ema_decay: 0.9993                            # Slightly adjusted for 119GB RAM
  log_every_n_steps: 50                        # Reduced logging frequency for memory

  # Precision loss configuration
  loss:
    classification_weight: 1.0
    regression_weight: 0.5                      # Higher regression weight
    regression_scale_factor: 8.0                 # Larger scale

  # Optimized scheduler for 119GB RAM with best model tracking
  scheduler:
    name: "warmup_plateau"
    warmup_epochs: 10                           # Slightly reduced warmup
    factor: 0.4                                 # Less aggressive reduction for smaller batch
    patience: 4                                 # Increased patience for stability
    cooldown: 2                                 # Longer cooldown
    min_lr: 1.0e-7
    metric: "mae_linear_um"                     # Same as best_metric for consistency
    mode: "min"                                 # Lower is better

  # Early stopping for best model
  early_stopping:
    enabled: true
    patience: 15                                # Stop if no improvement for 15 epochs
    metric: "mae_linear_um"                     # Same metric as best model
    mode: "min"
    restore_best_weights: true                  # Restore best model when stopping

  # Memory-optimized tensorboard settings
  tensorboard:
    enabled: true
    log_dir: "runs/tensorboard_119gb"
    flush_secs: 120                              # Less frequent flushing (was default)
    max_queue: 5                                 # Smaller queue size

# Logging paths relative to workspace - Best model only
logging:
  out_dir: "runs/korsch_high_precision_119gb"
  project_name: "korsch_interferometer_119gb"
  save_every: 1                                  # Check every epoch for best model
  keep_last_k: 1                                 # Keep ONLY the best model
  save_best_only: true                           # Save only when metric improves
  best_metric: "mae_linear_um"                   # Metric to monitor for best model
  best_mode: "min"                               # Lower is better for MAE
  dump_config: false                             # Skip config dumping to save space
  env_report: false                              # Skip environment reporting
  # Additional memory-saving options
  log_images: false                              # Disable image logging
  log_model_graph: false                         # Skip model graph logging

# Checkpointing with DataSphere paths
checkpoint:
  path: null  # Will be set by launcher script

# Memory and optimization settings
precision: amp
channels_last: true
torch_compile: false

# Testing configuration
testing:
  smoke_samples: 80                           # Adjusted for 119GB RAM

# System settings optimized for 119GB RAM
system:
  max_memory_gb: 119                          # System RAM capacity
  use_distributed: false                       # Single GPU mode
  mixed_precision: true
  gradient_checkpointing: true                  # Memory optimization